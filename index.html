<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工程查核</title>
<style>
:root{color-scheme:light dark;--bg:#fdf1e3;--panel:#fffaf4;--line:#ecd3b8;--acc:#ee8a1f;--acc2:#d9710a;--onacc:#fff;--ink:#43302a;--mute:#8f7566;--ok:#5f9e4a;--warn:#e8890c;--bad:#d4493f;--sh:0 4px 14px rgba(150,90,30,.14);--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#2b2019;--panel:#382a21;--line:#55402f;--acc:#f3a04a;--acc2:#e58d30;--onacc:#2b1a0b;--ink:#f6e8da;--mute:#bda28d;--ok:#8fcb78;--warn:#f3a04a;--bad:#ff8a7d;--sh:0 4px 14px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));border-radius:0 0 24px 24px;box-shadow:var(--sh)}
header h1{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
header span{font-size:14px;margin-right:8px;opacity:.95}
header button{background:rgba(255,255,255,.25);border:0;color:inherit;font-size:13px;padding:6px 14px;border-radius:999px}
nav{display:flex;gap:6px;margin:14px 16px 0;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;max-width:488px}
@media(min-width:520px){nav{margin-left:auto;margin-right:auto}}
nav button{flex:1;padding:9px;border:0;background:none;color:var(--mute);font-size:15px;border-radius:999px}
nav button.on{background:var(--acc);color:var(--onacc);font-weight:700}
main{max-width:520px;margin:0 auto;padding:6px 16px 32px}
label{display:block;font-size:13px;color:var(--mute);margin:16px 4px 6px;font-weight:500}
label i{color:var(--bad);font-style:normal}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px rgba(238,138,31,.2)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[readonly]{background:transparent;color:var(--mute);border-style:dashed}
.photo{position:relative;border:2px dashed var(--line);border-radius:var(--r);background:var(--panel);min-height:76px;display:flex;align-items:center;justify-content:center;color:var(--acc);cursor:pointer;overflow:hidden}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo img{width:100%;max-height:240px;object-fit:cover;display:none}
.photo.has{border-style:solid}.photo.has img{display:block}.photo.has svg{display:none}
.tog{display:flex;gap:4px;padding:4px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel)}
.tog button{flex:1;padding:10px;border:0;background:none;color:var(--mute);font-weight:700;font-size:16px;border-radius:999px}
.tog button.on.n{background:var(--warn);color:#fff}.tog button.on.y{background:var(--ok);color:#fff}
.go{width:100%;margin-top:26px;padding:15px;border:0;border-radius:999px;background:var(--acc);color:var(--onacc);font-size:17px;font-weight:700;box-shadow:var(--sh)}
.go:active{background:var(--acc2)}.go:disabled{opacity:.55}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;display:none;max-width:90%;z-index:20;box-shadow:var(--sh)}
.rec{background:var(--panel);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--line)}
.rec b{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rec small{color:var(--mute);display:block;font-size:12.5px;margin-top:4px}
.rec .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.rec a{color:var(--acc2)}
.rec button{padding:7px 16px;border:0;background:var(--acc);color:var(--onacc);border-radius:999px;font-weight:600}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.tag.w{background:rgba(232,137,12,.16);color:var(--warn)}.tag.l{background:rgba(212,73,63,.15);color:var(--bad)}.tag.d{background:rgba(95,158,74,.17);color:var(--ok)}
.bar{display:flex;gap:8px;margin:12px 0 14px}.bar select{flex:1}.bar button{padding:0 18px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px}
dialog{border:0;border-radius:22px;background:var(--panel);color:var(--ink);width:min(92vw,440px);box-shadow:0 10px 40px rgba(80,40,10,.3)}
dialog::backdrop{background:rgba(60,30,10,.45)}
dialog button.sec,.link{margin-top:8px;width:100%;padding:11px;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
#login{max-width:400px;margin:0 auto;padding:8vh 20px 24px}
.sheet{background:var(--panel);border-radius:28px;padding:28px 22px 22px;box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.sheet h2{font-size:26px;margin:12px 0 2px}
.sheet p{color:var(--mute);margin:0;font-size:14px}
.sheet>svg{color:var(--onacc);background:var(--acc);padding:10px;width:56px;height:56px;border-radius:18px}
.tb{display:flex;justify-content:space-between;gap:8px;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);font-size:12px;color:var(--mute)}
.tb small{display:none}
#login .link{border:0;color:var(--mute);font-size:13px;margin-top:10px}
.hint{font-style:normal;font-size:12px;color:var(--warn);float:right}
.tog.lock button{cursor:not-allowed}.tog.lock button:not(.on){opacity:.45}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}

.grid{display:block}
@media (min-width:360px) and (max-width:419px){main{padding-left:12px;padding-right:12px}}
@media (min-width:700px){
  body{font-size:17px}
  header{padding-left:max(28px,calc((100vw - 880px)/2));padding-right:max(28px,calc((100vw - 880px)/2))}
  nav{max-width:560px;margin-top:20px}
  main{max-width:880px;padding:10px 28px 40px}
  input,select,textarea{padding:14px 16px;min-height:50px}
  label{font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:row dense;gap:0 20px}
  .f.wide{grid-column:1/-1}
  .tog button,.go{padding-top:14px;padding-bottom:14px}
  .go{max-width:360px;margin-left:auto;margin-right:auto;display:block}
  #list.ascards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:start}
  .rec{margin:0}
  .bar{max-width:420px}
  #login{max-width:460px;padding-top:12vh}
  .sheet{padding:36px 32px 28px}
}
@media (min-width:1100px){
  main{max-width:1040px}
  header{padding-left:max(28px,calc((100vw - 1040px)/2));padding-right:max(28px,calc((100vw - 1040px)/2))}
  #list.ascards{grid-template-columns:repeat(3,1fr)}
}
@media (orientation:landscape) and (max-height:480px){
  #login{padding-top:16px}.sheet{padding:16px 20px}
}

.seg{display:flex;padding:3px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel)}
.seg button{padding:0 12px!important;border:0!important;background:none!important;color:var(--mute)!important;border-radius:10px!important;font-size:14px}
.seg button.on{background:var(--acc)!important;color:var(--onacc)!important;font-weight:700}
.tip{font-size:12.5px;color:var(--mute);margin:0 4px 10px}
.rec,.lrow{cursor:pointer}
.lbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.lrow{display:grid;grid-template-columns:1fr auto;grid-template-areas:"c1 c4" "c2 c2" "c3 c3";gap:2px 10px;padding:12px 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow:active,.rec:active{background:rgba(238,138,31,.12)}
.lrow .c1{grid-area:c1;font-weight:700}.lrow .c2{grid-area:c2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .c3{grid-area:c3;color:var(--mute);font-size:12.5px}.lrow .c4{grid-area:c4;align-self:start}
.ed{padding:2px}.ed h3{margin:0 0 4px}.ed h3 small{color:var(--mute);font-weight:400;font-size:12px;margin-left:6px}
#edlg{max-height:92vh;overflow:auto}
#edlg:not([open]){display:none}
.egrid{display:block}
.ro input:disabled,.ro select:disabled,.ro textarea:disabled{opacity:.85;border-style:dashed}
.ro .photo{pointer-events:none}
.pl{font-size:13px;margin-top:4px}.pl a{color:var(--acc2)}
@media (min-width:700px){
  #edlg{width:min(94vw,720px)}
  .egrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}
  .lrow{grid-template-columns:1.1fr 2.2fr 1.5fr auto;grid-template-areas:"c1 c2 c3 c4";align-items:center;padding:14px 18px}
  .lrow .c3{font-size:13px}.lrow .c4{align-self:center}
}

.dgrid{display:grid;grid-template-columns:1fr;gap:14px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.dcard h4{margin:0 0 12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.kpi[data-ps]{cursor:pointer}.kpi[data-ps]:active{background:rgba(238,138,31,.14)}
.kpi small{color:var(--mute);font-size:12.5px;display:block}
.kpi b{font-size:30px;line-height:1.2;display:block}
.kpi.w b{color:var(--warn)}.kpi.l b{color:var(--bad)}.kpi.d b{color:var(--ok)}
.donut{display:flex;align-items:center;gap:18px}
.donut svg{width:112px;height:112px;flex:none}
.donut .tr{stroke:var(--line)}.donut .pg{stroke:var(--ok)}.donut text{fill:var(--ink);font-weight:700;font-size:22px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-bottom:10px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.hb{display:grid;grid-template-columns:64px 1fr 30px;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tk{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--bg)}
.hb .tk em{display:block;height:100%}
.hb span:last-child{text-align:right;color:var(--mute);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.cw{background:var(--warn)}.cl{background:var(--bad)}.cd{background:var(--ok)}
.trend{width:100%;height:auto}.trend text{fill:var(--mute);font-size:9px}.trend .tn{fill:var(--acc)}.trend .td{fill:var(--ok)}.trend .ax{stroke:var(--line)}
.od{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.od:first-of-type{border-top:0}.od small{color:var(--mute);display:block}.od .tag{align-self:center}
@media (min-width:700px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .dgrid{grid-template-columns:repeat(2,1fr)}
  .dgrid .full{grid-column:1/-1}
  .hb{grid-template-columns:84px 1fr 34px}
}

.hb[data-pk]{cursor:pointer;border-radius:10px;padding:2px 4px;margin-left:-4px;margin-right:-4px}
.hb[data-pk]:hover,.hb[data-pk]:active{background:rgba(238,138,31,.14)}
.hb[data-pk] span:first-child{color:var(--acc2);font-weight:600}
#pdlg{width:min(96vw,860px);max-height:94vh;overflow:auto}
#pdlg:not([open]){display:none}
.popt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.popt select{width:auto;flex:none}.popt label{display:flex;margin:0;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.popt input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0}
.pbtns{display:flex;gap:8px;margin-top:12px}.pbtns .go,.pbtns .sec{margin:0;flex:1}
#pPreview{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.psheet{background:#fff;color:#222;font:13px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:18px;min-width:640px}
.psheet h1{font-size:21px;text-align:center;margin:0 0 12px;letter-spacing:.2em}
.psheet table{width:100%;border-collapse:collapse}
.psheet th,.psheet td{border:1px solid #555;padding:5px 7px;text-align:left;vertical-align:top}
.psheet th{background:#eee;font-weight:700}
.psheet .meta td{border:1px solid #555}.psheet .meta th{width:14%}
.psheet .list{margin-top:12px}.psheet .list thead{display:table-header-group}.psheet tr{page-break-inside:avoid}
.psheet img{max-height:70px;max-width:110px;display:block;border:1px solid #bbb}
.psheet .sign{margin-top:22px}.psheet .sign td{height:70px;width:33.3%}
.psheet .sign td small{display:block;color:#555}
.psheet .nc{text-align:center}
#printRoot{display:none}
@media print{
  body{background:#fff!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  #printRoot .psheet{padding:0;min-width:0}
  @page{size:A4;margin:12mm}
}

.qrbox{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.qrbox summary{cursor:pointer;color:var(--acc2);font-weight:600;font-size:14px;list-style:none}
.qrbox summary::-webkit-details-marker{display:none}
.qrbox summary::before{content:"▸ "}.qrbox[open] summary::before{content:"▾ "}
.qrimg{width:216px;height:216px;margin:12px auto 8px;background:#fff;border-radius:18px;padding:8px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;text-align:center}
.qrimg svg{width:100%;height:100%;display:block}
.qrnote{font-size:13px;color:var(--mute);text-align:center;margin:0 0 8px}
.qrbox label{margin-top:8px}
</style>
</head>
<body>

<section id="login" hidden>
  <div class="sheet">
    <svg width="40" height="40" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 28h24M7 28V10l9-6 9 6v18M12 28V16h8v12M12 20h8M3 31h26" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>工程查核</h2><p>歡迎回來，請登入開始查核</p>
    <label>帳號</label><input id="acc" autocomplete="username" autocapitalize="off">
    <label>密碼</label><input id="pwd" type="password" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="go" id="loginBtn" style="margin-top:8px">登入</button>
    <button class="link" id="setLink">連線設定</button>
    <details class="qrbox" id="qrBox"><summary>手機掃碼使用</summary>
      <div class="qrimg" id="qrImg"></div>
      <p class="qrnote" id="qrNote"></p>
      <div id="qrAppRow"><label>APP 網址（HTML 所在位置）</label><input id="appUrl" placeholder="https://…/工程查核APP.html" autocapitalize="off"></div>
      <button class="link" id="qrCopy">複製連結</button>
    </details>
    <div class="tb"><div>工程查核系統 V2</div><div id="tbdate"></div></div>
  </div>
</section>

<div id="app" hidden>
  <header><h1><svg width="22" height="22" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 28h24M7 28V10l9-6 9 6v18M12 28V16h8v12M12 20h8M3 31h26" stroke-linecap="round" stroke-linejoin="round"/></svg>工程查核</h1><div><span id="who"></span><button id="logout">登出</button></div></header>
  <nav><button id="t1" class="on">新增查核</button><button id="t2">查核紀錄</button><button id="t3">儀表板</button></nav>

  <main id="v1"><div class="grid">
    <div class="f"><label>查核日期<i>*</i></label><input type="date" id="date"></div>
    <div class="f"><label>查核人<i>*</i></label><input id="inspector" readonly></div>
    <div class="f"><label>棟別<i>*</i></label><select id="building"></select></div>
    <div class="f"><label>戶別</label><select id="unit"></select></div>
    <div class="f"><label>樓層<i>*</i></label><select id="floor"></select></div>
    <div class="f wide"><label>查核缺失<i>*</i></label><textarea id="defect" rows="2" placeholder="例：浴室地坪洩水不良"></textarea></div>
    <div class="f wide"><label>缺失照片</label> <div class="photo" id="p1"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg><img alt="缺失照片"><input type="file" accept="image/*" capture="environment"></div></div>
    <div class="f"><label>責任單位<i>*</i></label><select id="dept"></select></div>
    <div class="f"><label>改善預定日期<i>*</i></label><input type="date" id="due"></div>
    <div class="f"><label>改善完成日期</label><input type="datetime-local" id="doneDate"></div>
    <div class="f wide"><label>改善照片</label> <div class="photo" id="p2"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg><img alt="改善照片"><input type="file" accept="image/*" capture="environment"></div></div>
    <div class="f"><label>完成否<i>*</i><em class="hint" id="doneHint" hidden>僅管理者可設定</em></label> <div class="tog" id="done"><button class="on n" data-v="N">N</button><button data-v="Y">Y</button></div></div>
    <div class="f wide"><button class="go" id="save">送出查核</button></div>
  </div>
  </main>

  <main id="v2" hidden>
    <div class="bar"><select id="flt"><option value="">全部</option><option value="N">未完成</option><option value="Y">已完成</option></select><div class="seg" id="viewSeg"><button data-v="card">卡片</button><button data-v="list">條列</button></div><button id="reload">重新整理</button></div>
    <p class="tip">點選項目可檢視或編修</p>
    <div id="list"></div>
  </main>
<main id="v3" hidden>
    <div class="bar"><select id="dRange"><option value="">全部期間</option><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="m">本月</option></select><select id="dBld"><option value="">全部棟別</option></select><button id="dReload">重新整理</button></div>
    <div class="dgrid" id="dash"></div>
  </main>
</div>
<dialog id="edlg"><div class="ed" id="edBody">
  <h3>編修查核<small id="eid"></small></h3>
  <div class="egrid">
    <div class="f"><label>查核日期<i>*</i></label><input type="date" id="e_date"></div>
    <div class="f"><label>查核人</label><input id="e_inspector" readonly></div>
    <div class="f"><label>棟別<i>*</i></label><select id="e_building"></select></div>
    <div class="f"><label>戶別</label><select id="e_unit"></select></div>
    <div class="f"><label>樓層<i>*</i></label><select id="e_floor"></select></div>
    <div class="f"><label>責任單位<i>*</i></label><select id="e_dept"></select></div>
    <div class="f" style="grid-column:1/-1"><label>查核缺失<i>*</i></label><textarea id="e_defect" rows="2"></textarea></div>
    <div class="f"><label>缺失照片（重拍可更換）</label><div class="photo" id="ep1"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg><img alt="缺失照片"><input type="file" accept="image/*" capture="environment"></div></div>

  catch(e){ $('#list').innerHTML=`<div class="empty">載入失敗：${esc(e.message)}</div>`; }
}
let view = ls.get('view')==='list' ? 'list' : 'card';
function stat(r){ const done=r['完成否']==='Y', late=!done&&String(r['改善預定日期']).slice(0,10)<today(); return {done,late,txt:done?'已完成':late?'逾期':'未完成',cls:done?'d':late?'l':'w'}; }
function render(){
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const f=$('#flt').value, a=rows.filter(r=>!f||String(r['完成否'])===f), L=$('#list');
  if(!a.length){ L.className=''; L.innerHTML='<div class="empty">沒有符合的紀錄</div>'; return; }
  const loc=r=>`${esc(r['棟別'])} ${esc(r['戶別'])} ${esc(r['樓層'])}｜${esc(r['責任單位'])}`;
  const d10=v=>esc(String(v).slice(0,10));
  if(view==='list'){
    L.className='lbox';
    L.innerHTML=a.map(r=>{const s=stat(r);return `<div class="lrow" data-id="${esc(r['編號'])}"><span class="c1">${loc(r)}</span><span class="c2">${esc(r['查核缺失'])}</span><span class="c3">${d10(r['查核日期'])}・${esc(r['查核人'])}　預定 ${d10(r['改善預定日期'])}</span><span class="c4 tag ${s.cls}">${s.txt}</span></div>`}).join('');
  }else{
    L.className='ascards';
    L.innerHTML=a.map(r=>{const s=stat(r);
      const pic=r['缺失照片']?`<a href="${esc(viewUrl(r['缺失照片']))}" target="_blank" rel="noopener">缺失照片</a>`:'';
      const pic2=r['改善照片']?` <a href="${esc(viewUrl(r['改善照片']))}" target="_blank" rel="noopener">改善照片</a>`:'';
      return `<div class="rec" data-id="${esc(r['編號'])}"><b><span>${loc(r)}</span><span class="tag ${s.cls}">${s.txt}</span></b>
      <div>${esc(r['查核缺失'])}</div><small>查核 ${d10(r['查核日期'])}・${esc(r['查核人'])}　預定改善 ${d10(r['改善預定日期'])}</small>
      <div class="row"><span>${pic}${pic2}</span>${s.done||!isAdmin()?'<span></span>':`<button data-done="${esc(r['編號'])}">標記完成</button>`}</div></div>`}).join('');
  }
  L.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openEdit(el.dataset.id));
  L.querySelectorAll('a').forEach(x=>x.onclick=e=>e.stopPropagation());
  L.querySelectorAll('[data-done]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation(); b.disabled=true;
    try{ await authed({action:'complete',id:b.dataset.done,doneDate:nowLocal().replace('T',' ')}); toast('已標記完成'); load(); }
    catch(err){ toast('失敗：'+err.message); b.disabled=false; }
  });
}
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>{view=b.dataset.v; ls.set('view',view); render();});

// ---- 檢視 / 編修 ----
let editId='', eDone='N', ephotos={p1:'',p2:''};
function setEDone(v){ eDone=v; document.querySelectorAll('#eDone button').forEach(b=>{b.className=b.dataset.v===v?'on '+v.toLowerCase():''}); }
document.querySelectorAll('#eDone button').forEach(b=>b.onclick=()=>{ if(!isAdmin()) return toast('完成否僅管理者可設定'); setEDone(b.dataset.v); if(b.dataset.v==='Y'&&!$('#e_doneDate').value)$('#e_doneDate').value=nowLocal(); });
['ep1','ep2'].forEach((id,i)=>{ const k='p'+(i+1), box=$('#'+id);
  box.querySelector('input').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ ephotos[k]=await compress(f); box.querySelector('img').src=ephotos[k]; box.classList.add('has'); }catch(err){ toast('照片讀取失敗，請重新拍攝'); } };
});
function setEPhoto(id,url){ const box=$('#'+id), img=box.querySelector('img'); delete img.dataset.f; img.referrerPolicy='no-referrer'; img.onerror=()=>{ if(!img.dataset.f&&url){ img.dataset.f=1; img.src=thumb2(url); } }; if(url){ img.src=thumb(url); box.classList.add('has'); } else { img.removeAttribute('src'); box.classList.remove('has'); } }
function openEdit(id){
  const r=rows.find(x=>String(x['編號'])===String(id)); if(!r) return;
  editId=id; ephotos={p1:'',p2:''};
  const can=isAdmin()||String(r['查核人'])===ls.get('name');
  $('#eid').textContent=id; $('#eerr').textContent='';
  fill('e_building',OPTS['棟別'],'請選擇',r['棟別']); fill('e_unit',OPTS['戶別'],'（不指定）',r['戶別']);
  fill('e_floor',OPTS['樓層'],'請選擇',r['樓層']); fill('e_dept',OPTS['責任單位'],'請選擇',r['責任單位']);
  $('#e_building').value=r['棟別']; $('#e_unit').value=r['戶別']; $('#e_floor').value=r['樓層']; $('#e_dept').value=r['責任單位'];
  $('#e_date').value=String(r['查核日期']).slice(0,10); $('#e_inspector').value=r['查核人'];
  $('#e_defect').value=r['查核缺失']; $('#e_due').value=String(r['改善預定日期']).slice(0,10);
  $('#e_doneDate').value=String(r['改善完成日期']||'').slice(0,16).replace(' ','T');
  setEPhoto('ep1',r['缺失照片']); setEPhoto('ep2',r['改善照片']);
  setEDone(r['完成否']==='Y'?'Y':'N');
  $('#eDone').classList.toggle('lock',!isAdmin()); $('#eDoneHint').hidden=isAdmin();
  $('#edBody').classList.toggle('ro',!can);
  $('#edlg').querySelectorAll('input:not([readonly]),select,textarea').forEach(x=>x.disabled=!can);
  $('#eSave').hidden=!can;
  if(!can) $('#eerr').textContent='這筆由「'+r['查核人']+'」建立，僅供檢視';
  $('#edlg').showModal();
}
$('#eClose').onclick=()=>$('#edlg').close();
$('#eSave').onclick=async()=>{
  const d={action:'update',id:editId,date:$('#e_date').value,building:$('#e_building').value,unit:$('#e_unit').value,floor:$('#e_floor').value,
    defect:$('#e_defect').value.trim(),dept:$('#e_dept').value,dueDate:$('#e_due').value,doneDate:$('#e_doneDate').value.replace('T',' '),
    defectPhoto:ephotos.p1,fixPhoto:ephotos.p2,done:eDone};
  const miss=[['date','查核日期'],['building','棟別'],['floor','樓層'],['defect','查核缺失'],['dept','責任單位'],['dueDate','改善預定日期']].filter(([k])=>!d[k]).map(x=>x[1]);
  if(miss.length){ $('#eerr').textContent='請填寫：'+miss.join('、'); return; }
  const b=$('#eSave'); b.disabled=true; b.textContent='儲存中…';
  try{ await authed(d); $('#edlg').close(); toast('已儲存變更'); reloadCur(); }
  catch(e){ $('#eerr').textContent='儲存失敗：'+e.message; }
  finally{ b.disabled=false; b.textContent='儲存變更'; }
};
$('#flt').onchange=render; $('#reload').onclick=load;


// ---- 儀表板 ----
const D=s=>String(s||'').slice(0,10);
const gid=u=>{const m=String(u||'').match(/[?&]id=([\w-]+)|\/d\/([\w-]+)/);return m?(m[1]||m[2]):''};
const thumb=u=>{const i=gid(u);return i?`https://drive.google.com/thumbnail?id=${i}&sz=w800`:u};
const thumb2=u=>{const i=gid(u);return i?`https://lh3.googleusercontent.com/d/${i}=w800`:u};
const viewUrl=u=>{const i=gid(u);return i?`https://drive.google.com/file/d/${i}/view`:u};
const dayNum=s=>{const [y,m,d]=D(s).split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
async function loadDash(){
  $('#dash').innerHTML='<div class="empty full">載入中…</div>';
  try{ rows=(await authed({action:'list'})).rows||[]; }
  catch(e){ $('#dash').innerHTML=`<div class="empty full">載入失敗：${esc(e.message)}</div>`; return; }
  const sel=$('#dBld'), cur=sel.value, bl=[...new Set(rows.map(r=>r['棟別']).filter(Boolean))];
  sel.innerHTML='<option value="">全部棟別</option>'+bl.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join(''); sel.value=bl.includes(cur)?cur:'';
  renderDash();
}
function renderDash(){
  const t=today(), tn=dayNum(t), rg=$('#dRange').value, bd=$('#dBld').value;
  const cut=!rg?'':rg==='m'?t.slice(0,8)+'01':today(new Date(Date.now()-(Number(rg)-1)*864e5));
  const a=rows.filter(r=>(!bd||r['棟別']===bd)&&(!cut||D(r['查核日期'])>=cut));
  dashRows=a;
  const st=a.map(r=>({r,...stat(r)}));
  const total=a.length, done=st.filter(x=>x.done).length, late=st.filter(x=>x.late).length, open=total-done;
  const pct=total?Math.round(done/total*100):0;
  if(!total){ $('#dash').innerHTML='<div class="empty full">此條件下沒有資料</div>'; return; }

  const circ=2*Math.PI*42, dash=circ*pct/100;
  const donut=`<div class="donut"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="42" fill="none" stroke-width="12"/><circle class="pg" cx="50" cy="50" r="42" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${dash} ${circ}" transform="rotate(-90 50 50)"/><text x="50" y="58" text-anchor="middle">${pct}%</text></svg>
    <div><b>改善完成率</b><div class="lg" style="margin:6px 0 0;flex-direction:column;gap:2px"><span>已完成 ${done} 件</span><span>未完成 ${open} 件</span></div></div></div>`;

  const grp=(key,n)=>{ const m={}; st.forEach(x=>{const k=x.r[key]||'（未填）';const o=m[k]||(m[k]={w:0,l:0,d:0});x.done?o.d++:x.late?o.l++:o.w++;});
    const arr=Object.entries(m).sort((p,q)=>(q[1].w+q[1].l)-(p[1].w+p[1].l)||(q[1].w+q[1].l+q[1].d)-(p[1].w+p[1].l+p[1].d)).slice(0,n);
    const mx=Math.max(...arr.map(([,o])=>o.w+o.l+o.d));
    return arr.map(([k,o])=>{const s=o.w+o.l+o.d,f=v=>(v/mx*100).toFixed(1)+'%';return `<div class="hb" data-pk="${esc(key)}" data-pv="${esc(k)}" title="點選列印缺失單"><span title="${esc(k)}">${esc(k)}</span><div class="tk"><em class="cl" style="width:${f(o.l)}"></em><em class="cw" style="width:${f(o.w)}"></em><em class="cd" style="width:${f(o.d)}"></em></div><span>${s}</span></div>`}).join(''); };
  const legend='<div class="lg"><span><i class="cl"></i>逾期</span><span><i class="cw"></i>未完成</span><span><i class="cd"></i>已完成</span></div>';

  const days=[...Array(14)].map((_,i)=>today(new Date(Date.now()-(13-i)*864e5)));
  const nw=days.map(d=>a.filter(r=>D(r['查核日期'])===d).length), dn=days.map(d=>a.filter(r=>r['完成否']==='Y'&&D(r['改善完成日期'])===d).length);
  const mx=Math.max(1,...nw,...dn);
  const bars=days.map((d,i)=>{const x=10+i*23,h1=nw[i]/mx*80,h2=dn[i]/mx*80;
    return `<rect class="tn" x="${x}" y="${96-h1}" width="8" height="${h1}" rx="2"/><rect class="td" x="${x+9}" y="${96-h2}" width="8" height="${h2}" rx="2"/>${i%2===0?`<text x="${x+8}" y="109" text-anchor="middle">${d.slice(5).replace('-','/')}</text>`:''}`}).join('');
  const trend=`<div class="lg"><span><i style="background:var(--acc)"></i>新增查核</span><span><i class="cd"></i>完成改善</span><span>最高 ${mx} 件／日</span></div><svg class="trend" viewBox="0 0 340 114"><line class="ax" x1="4" y1="96" x2="336" y2="96"/>${bars}</svg>`;

  const od=st.filter(x=>x.late).sort((p,q)=>D(p.r['改善預定日期']).localeCompare(D(q.r['改善預定日期']))).slice(0,6)
    .map(x=>`<div class="od" data-id="${esc(x.r['編號'])}"><span>${esc(x.r['棟別'])} ${esc(x.r['戶別'])} ${esc(x.r['樓層'])}｜${esc(x.r['責任單位'])}<small>${esc(x.r['查核缺失'])}</small></span><span class="tag l">逾 ${tn-dayNum(x.r['改善預定日期'])} 天</span></div>`).join('');

  $('#dash').innerHTML=`<div class="kpis full">
    <div class="kpi" data-ps="total"><small>查核總數</small><b>${total}</b></div>
    <div class="kpi w" data-ps="open"><small>未完成</small><b>${open}</b></div>
    <div class="kpi l" data-ps="late"><small>逾期未改善</small><b>${late}</b></div>
    <div class="kpi d" data-ps="done"><small>已完成</small><b>${done}</b></div></div>
    <div class="dcard">${donut}</div>
    <div class="dcard"><h4>近 14 天趨勢</h4>${trend}</div>
    <div class="dcard"><h4>責任單位（點選列印）</h4>${legend}${grp('責任單位',8)}</div>
    <div class="dcard"><h4>棟別（點選列印）</h4>${legend}${grp('棟別',8)}</div>
    <div class="dcard"><h4>查核者（點選列印）</h4>${legend}${grp('查核人',8)}</div>
    <div class="dcard"><h4>逾期待辦</h4>${od||'<div class="empty" style="padding:16px 0">沒有逾期項目</div>'}</div>`;
  $('#dash').querySelectorAll('.od').forEach(el=>el.onclick=()=>openEdit(el.dataset.id));
  $('#dash').querySelectorAll('[data-pk]').forEach(el=>el.onclick=()=>openPrint(el.dataset.pk,el.dataset.pv));
  $('#dash').querySelectorAll('[data-ps]').forEach(el=>el.onclick=()=>openPrint('status',el.dataset.ps));
}
$('#dRange').onchange=renderDash; $('#dBld').onchange=renderDash; $('#dReload').onclick=loadDash;
function reloadCur(){ $('#v3').hidden?load():loadDash(); }


// ---- 缺失單列印 ----
let dashRows=[], pKey='', pVal='';
const S_LABEL={total:'全部缺失',open:'未完成',late:'逾期未改善',done:'已完成'};
const P_LABEL={'責任單位':'責任單位','棟別':'棟別','查核人':'查核人','status':'篩選條件'};
function sheetHtml(list,pic){
  const open=list.filter(r=>r['完成否']!=='Y').length, t=new Date(), byDept=pKey!=='責任單位';
  const ts=`${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}`;
  const val=pKey==='status'?S_LABEL[pVal]:pVal;
  const body=list.map((r,i)=>`<tr><td class="nc">${i+1}</td><td>${esc(r['編號'])}</td><td>${esc(r['棟別'])} ${esc(r['戶別'])} ${esc(r['樓層'])}</td>${byDept?`<td>${esc(r['責任單位'])}</td>`:''}<td>${esc(r['查核缺失'])}</td>${pic?`<td>${r['缺失照片']?`<img src="${esc(thumb(r['缺失照片']))}" referrerpolicy="no-referrer" alt="缺失照片" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${esc(thumb2(r['缺失照片']))}'}else{this.outerHTML='（照片無法顯示）'}">`:''}</td>`:''}<td>${esc(D(r['查核日期']))}<br>${esc(r['查核人'])}</td><td class="nc">${esc(D(r['改善預定日期']))}</td><td class="nc">${stat(r).txt}</td></tr>`).join('');
  return `<div class="psheet"><h1>${pKey==='責任單位'?'工程缺失改善通知單':'工程缺失清單'}</h1>
  <table class="meta"><tr><th>${P_LABEL[pKey]}</th><td>${esc(val)}</td><th>列印日期</th><td>${ts}</td></tr>
  <tr><th>缺失件數</th><td>${list.length} 件（未完成 ${open} 件）</td><th>列印人</th><td>${esc(ls.get('name'))}</td></tr></table>
  <table class="list"><thead><tr><th class="nc">序</th><th>編號</th><th>位置</th>${byDept?'<th>責任單位</th>':''}<th>缺失內容</th>${pic?'<th>照片</th>':''}<th>查核</th><th>預定改善</th><th>狀態</th></tr></thead><tbody>${body}</tbody></table>
  <table class="sign"><tr><td><small>查核人簽章／日期</small></td><td><small>責任單位簽收／日期</small></td><td><small>複查結果／日期</small></td></tr></table></div>`;
}
function pList(){ const only=$('#pOnly').value==='open';
  return dashRows.filter(r=>{
    if(pKey==='status'){ const s=stat(r); return pVal==='total'||(pVal==='open'&&!s.done)||(pVal==='late'&&s.late)||(pVal==='done'&&s.done); }
    return (r[pKey]||'（未填）')===pVal&&(!only||r['完成否']!=='Y');
  }).sort((p,q)=>D(p['改善預定日期']).localeCompare(D(q['改善預定日期']))); }
function buildPrint(){
  const list=pList(); $('#pCount').textContent=list.length+' 件'; $('#pPrint').disabled=!list.length;
  $('#pPreview').innerHTML=list.length?sheetHtml(list,$('#pPic').checked):'<div class="empty">沒有符合的缺失</div>';
}
function openPrint(key,val){ pKey=key; pVal=val; $('#pOnly').hidden=key==='status'; buildPrint(); $('#pdlg').showModal(); }
$('#pOnly').onchange=buildPrint; $('#pPic').onchange=buildPrint; $('#pClose').onclick=()=>$('#pdlg').close();
$('#pPrint').onclick=()=>{ $('#printRoot').innerHTML=$('#pPreview').innerHTML; setTimeout(()=>window.print(),150); };
window.addEventListener('afterprint',()=>{ $('#printRoot').innerHTML=''; });

// ---- 分頁 / 設定 ----
function tab(n){ [1,2,3].forEach(i=>{ $('#v'+i).hidden=n!==i; $('#t'+i).className=n===i?'on':''; }); if(n===2) load(); if(n===3) loadDash(); }
$('#t1').onclick=()=>tab(1); $('#t2').onclick=()=>tab(2); $('#t3').onclick=()=>tab(3);
$('#setLink').onclick=()=>{ $('#url').value=api(); $('#dlg').showModal(); };
$('#closeSet').onclick=()=>$('#dlg').close();
$('#saveSet').onclick=()=>{ ls.set('url',$('#url').value.trim()); $('#dlg').close(); toast('已儲存設定'); renderQR(); };

$('#tbdate').textContent=today();

// ---- 登入頁 QR Code ----
const b64u=s=>btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return atob(s)};
let qrText='';
function qrDraw(text){
  const m=QR.make(text), n=m.length, q=4; let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(m[r][c]) d+=`M${c+q} ${r+q}h1v1h-1z`;
  $('#qrImg').innerHTML=`<svg viewBox="0 0 ${n+q*2} ${n+q*2}" shape-rendering="crispEdges" role="img" aria-label="QR Code"><path d="${d}" fill="#2b1b10"/></svg>`;
}
function renderQR(){
  const a=api(), img=$('#qrImg'), note=$('#qrNote'); qrText='';
  $('#qrAppRow').hidden=!!BUILTIN_API; $('#qrCopy').hidden=true;
  if(!a){ img.textContent='尚未設定連線'; note.textContent='請先按「連線設定」貼上 Apps Script 網址，才能產生 QR Code'; return; }
  if(BUILTIN_API){ qrText=BUILTIN_API; note.textContent='用手機掃描即可開啟 APP，連線已自動設定'; }
  else{
    const base=$('#appUrl').value.trim();
    if(!/^https?:\/\//i.test(base)){ img.textContent='請先填入 APP 網址'; note.textContent='填入 HTML 檔放置的網址（如 GitHub Pages、公司網站），手機掃描後會自動開啟並完成連線設定'; return; }
    qrText=base.split('#')[0]+'#cfg='+b64u(a); note.textContent='掃描後會開啟 APP，並自動完成連線設定';
  }
  qrDraw(qrText); $('#qrCopy').hidden=false;
}
$('#appUrl').value=ls.get('appUrl')||DEFAULT_APP_URL||(!BUILTIN_API&&/^https?:/.test(location.protocol)?location.href.split('#')[0]:'');
$('#appUrl').oninput=()=>{ ls.set('appUrl',$('#appUrl').value.trim()); renderQR(); };
$('#qrCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(qrText); toast('已複製連結'); }catch(e){ toast('無法自動複製，請手動長按選取'); } };
$('#qrBox').open=window.innerWidth>=700;
if(BUILTIN_API) $('#setLink').hidden=true;
renderQR();

// 掃碼進入：#cfg=… 自動完成連線設定
(function(){ const m=location.hash.match(/^#cfg=([\w-]+)/); if(!m) return;
  try{ const u=unb64u(m[1]); if(API_RE.test(u)){ ls.set('url',u); history.replaceState(null,'',location.pathname+location.search); renderQR(); setTimeout(()=>toast('已完成連線設定，請登入'),300); } }catch(e){} })();

// ---- 啟動 ----
if(ls.get('token')) enter(); else { showLogin(); if(!api()) setTimeout(()=>$('#dlg').showModal(),400); }
</script>
